
services:
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_BACKEND_URL=http://localhost:8000
      - VITE_AI_URL=http://localhost:8001

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./data:/data
      - /Users/yshokrollahi/Downloads:/mounted/downloads
    environment:
      - AI_SERVICE_URL=http://ai_service:8001
      - VITAMINP_DATA_ROOT=/data/sample_slides
      - VITAMINP_ALLOWED_SOURCE_ROOTS=/data,/mnt/slides,/mounted
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  ai_service:
    build: ./ai_service
    ports:
      - "8001:8001"
    volumes:
      - ./ai_service:/app
      - ./data:/data
    environment:
      - VITAMINP_DEVICE=auto
    command: uvicorn main:app --host 0.0.0.0 --port 8001