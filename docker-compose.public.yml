services:
  frontend:
    image: ghcr.io/idso-fa1-pathology/vitaminpscope/frontend:latest
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    image: ghcr.io/idso-fa1-pathology/vitaminpscope/backend:latest
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
    environment:
      - AI_SERVICE_URL=http://ai_service:8001
      - VITAMINP_DATA_ROOT=/data/sample_slides
      - VITAMINP_ALLOWED_SOURCE_ROOTS=/data
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped

  ai_service:
    image: ghcr.io/idso-fa1-pathology/vitaminpscope/ai_service:latest
    profiles: ["gpu"]
    volumes:
      - ./data:/data
    environment:
      - VITAMINP_DEVICE=auto
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    command: uvicorn main:app --host 0.0.0.0 --port 8001
    restart: unless-stopped    
    ports:
     - "8001:8001"
    gpus: all